<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クリフトンストレングス 177問診断ツール</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
      color: #333;
      line-height: 1.6;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header {
      text-align: center;
      padding: 40px 0 20px;
      background: linear-gradient(135deg, #7A32A3 0%, #E87722 50%, #1B6BAE 100%);
      color: white;
      margin: -20px -20px 30px -20px;
      padding: 40px 20px;
    }
    header h1 { font-size: 2.2em; margin-bottom: 5px; }
    header p { font-size: 0.95em; opacity: 0.95; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #e0e0e0;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1em;
      font-weight: 500;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: #333;
      border-bottom-color: #7A32A3;
    }
    .tab-btn:hover { color: #333; }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Browse Tab */
    .domain-section { margin-bottom: 40px; }
    .domain-title {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 3px solid;
    }
    .strength-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .strength-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .strength-card:hover { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .strength-card-header {
      padding: 15px;
      color: white;
      font-weight: bold;
    }
    .strength-card-name { font-size: 1.1em; margin-bottom: 5px; }
    .strength-card-en { font-size: 0.85em; opacity: 0.9; }
    .strength-card-body {
      padding: 15px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .strength-card.expanded .strength-card-body { max-height: 500px; }
    .strength-card-desc { margin-bottom: 12px; font-size: 0.95em; }
    .strength-card-tips {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .strength-card-tips strong { display: block; margin-bottom: 5px; }
    .strength-card-tips li { margin-left: 20px; margin-bottom: 5px; }

    /* Quiz Tab */
    .quiz-intro {
      background: white;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .quiz-intro h2 { margin-bottom: 15px; }
    .quiz-intro p { margin-bottom: 10px; color: #666; }
    .start-btn {
      background: linear-gradient(135deg, #7A32A3 0%, #E87722 100%);
      color: white;
      padding: 12px 40px;
      border: none;
      border-radius: 6px;
      font-size: 1.05em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }
    .start-btn:hover { transform: scale(1.05); }

    .quiz-container { display: none; }
    .quiz-container.active { display: block; }
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7A32A3 0%, #E87722 50%, #1B6BAE 100%);
      width: 0;
      transition: width 0.4s ease;
    }
    .progress-text {
      text-align: center;
      margin-bottom: 15px;
      font-size: 0.95em;
      color: #666;
    }

    .bipolar-card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .bipolar-content {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      align-items: center;
    }
    @media (max-width: 640px) {
      .bipolar-content { grid-template-columns: 1fr; }
    }
    .bipolar-text { font-size: 0.95em; line-height: 1.5; }
    .bipolar-text.a { text-align: right; }
    .bipolar-text.b { text-align: left; }
    @media (max-width: 640px) {
      .bipolar-text.a { text-align: left; }
      .bipolar-text.b { text-align: left; }
    }
    .scale-buttons {
      display: flex;
      gap: 8px;
      flex-direction: column;
    }
    @media (max-width: 640px) {
      .scale-buttons { flex-direction: row; justify-content: center; }
    }
    .scale-btn {
      width: 50px;
      height: 50px;
      border: 2px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1em;
      transition: all 0.2s ease;
    }
    .scale-btn:hover { transform: scale(1.08); border-color: #7A32A3; }
    .scale-btn.selected {
      background: #7A32A3;
      color: white;
      border-color: #7A32A3;
      transform: scale(1.12);
    }
    .scale-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 0.85em;
      color: #999;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 10px;
    }
    .nav-btn {
      padding: 10px 20px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .nav-btn:hover:not(:disabled) { background: #f5f5f5; }
    .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .completion-panel {
      background: linear-gradient(135deg, #7A32A3 0%, #E87722 100%);
      color: white;
      padding: 40px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .completion-panel.show { display: block; animation: slideUp 0.4s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .completion-panel h2 { font-size: 2em; margin-bottom: 15px; }
    .completion-panel p { font-size: 1.1em; margin-bottom: 30px; }
    .results-btn {
      background: white;
      color: #7A32A3;
      padding: 12px 40px;
      border: none;
      border-radius: 6px;
      font-size: 1.05em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .results-btn:hover { transform: scale(1.05); }

    /* Results Tab */
    .results-container { display: none; }
    .results-container.active { display: block; }
    .results-header {
      background: linear-gradient(135deg, #7A32A3 0%, #E87722 100%);
      color: white;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .dominant-domain {
      font-size: 1.2em;
      margin-bottom: 10px;
    }
    .domain-score-bar {
      background: white;
      height: 40px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      padding: 5px;
    }
    .domain-score-bar-label {
      width: 120px;
      font-weight: bold;
      color: #333;
      font-size: 0.9em;
    }
    .domain-score-bar-fill {
      flex: 1;
      height: 30px;
      border-radius: 4px;
      transition: width 1.2s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      color: white;
      font-weight: bold;
      font-size: 0.9em;
    }

    .top5-section {
      margin-bottom: 40px;
    }
    .section-title {
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #ddd;
    }
    .top5-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .result-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-left: 4px solid;
    }
    .result-card-rank {
      font-size: 0.9em;
      color: #999;
      margin-bottom: 5px;
    }
    .result-card-name {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .result-card-score {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .result-card-desc {
      font-size: 0.95em;
      line-height: 1.5;
      color: #666;
    }

    .ranking-table {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      margin-bottom: 30px;
    }
    .ranking-table table {
      width: 100%;
      border-collapse: collapse;
    }
    .ranking-table th {
      background: #f5f5f5;
      padding: 15px;
      text-align: left;
      font-weight: bold;
      border-bottom: 2px solid #e0e0e0;
    }
    .ranking-table td {
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
    }
    .ranking-rank { width: 60px; font-weight: bold; }
    .ranking-name { font-weight: 500; }
    .ranking-score { text-align: right; font-weight: bold; width: 80px; }
    .ranking-table tr:hover { background: #f9f9f9; }

    .retry-btn {
      background: linear-gradient(135deg, #7A32A3 0%, #E87722 100%);
      color: white;
      padding: 12px 40px;
      border: none;
      border-radius: 6px;
      font-size: 1.05em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: block;
      margin: 30px auto 0;
    }
    .retry-btn:hover { transform: scale(1.05); }

    /* Color utilities */
    .exe { color: #7A32A3; }
    .bg-exe { background-color: #7A32A3; }
    .inf { color: #E87722; }
    .bg-inf { background-color: #E87722; }
    .rel { color: #1B6BAE; }
    .bg-rel { background-color: #1B6BAE; }
    .str { color: #00855B; }
    .bg-str { background-color: #00855B; }
  </style>
</head>
<body>
  <header>
    <h1>🎯 クリフトンストレングス 177問診断ツール</h1>
    <p>あなたの強みを発見しよう</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('browse')">📖 34資質一覧</button>
      <button class="tab-btn" onclick="showTab('quiz')">📝 177問診断</button>
      <button class="tab-btn" onclick="showTab('results')">📊 結果分析</button>
    </div>

    <!-- Browse Tab -->
    <div id="browse" class="tab-content active"></div>

    <!-- Quiz Tab -->
    <div id="quiz" class="tab-content">
      <div class="quiz-intro">
        <h2>クリフトンストレングス診断テスト</h2>
        <p>以下の177問の対比式設問に答えることで、あなたの強みプロフィールが明らかになります。</p>
        <p>直感的に、迷わず答えることが大切です。所要時間：約20～30分</p>
        <button class="start-btn" onclick="startQuiz()">診断を開始する</button>
      </div>

      <div class="quiz-container">
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text"><span id="progress-num">0</span> / 177問</div>

        <div class="bipolar-card">
          <div class="bipolar-content">
            <div class="bipolar-text a" id="text-a"></div>
            <div class="scale-buttons" id="scale-buttons"></div>
            <div class="bipolar-text b" id="text-b"></div>
          </div>
          <div class="scale-labels">
            <span>← Aに近い</span>
            <span>どちらでもない</span>
            <span>Bに近い →</span>
          </div>
        </div>

        <div class="quiz-nav">
          <button class="nav-btn" onclick="prevQ()" id="prev-btn">← 前の質問</button>
          <button class="nav-btn" onclick="nextQ()" id="next-btn">次の質問 →</button>
        </div>

        <div class="completion-panel" id="completion-panel">
          <h2>✅ 診断完了！</h2>
          <p>177問すべての質問に回答いただきました。</p>
          <button class="results-btn" onclick="showResults()">結果を見る</button>
        </div>
      </div>
    </div>

    <!-- Results Tab -->
    <div id="results" class="tab-content results-container"></div>
  </div>

  <script>
    // ドメイン定義

      { l: 'significance', r: 'woo', a: '自分の成果が世に認識されることが、モチベーションです。', b: '多くの人との関係を通じて、自分の価値を示したいです。' }

    // グローバル変数
    let currentQ = 0;
    let answers = {};
    let scores = {};
    let quizStarted = false;

    // タブ切り替え
    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // 34資質一覧タブの生成
    function buildBrowse() {
      const browse = document.getElementById('browse');
      const domainOrder = ['exe', 'inf', 'rel', 'str'];

      browse.innerHTML = '';
      domainOrder.forEach(cat => {
        const strengths = S.filter(s => s.cat === cat);
        const section = document.createElement('div');
        section.className = 'domain-section';

        const title = document.createElement('div');
        title.className = 'domain-title';
        title.style.borderBottomColor = CATS[cat].color;
        title.textContent = CATS[cat].name;
        section.appendChild(title);

        const cards = document.createElement('div');
        cards.className = 'strength-cards';

        strengths.forEach(s => {
          const card = document.createElement('div');
          card.className = 'strength-card';
          card.innerHTML = `
            <div class="strength-card-header" style="background-color: ${CATS[s.cat].color}">
              <div class="strength-card-name">${s.name}</div>
              <div class="strength-card-en">${s.en}</div>
            </div>
            <div class="strength-card-body">
              <div class="strength-card-desc">${s.desc}</div>
              <div class="strength-card-tips">
                <strong>活用のヒント：</strong>
                <ul>
                  ${s.tips.map(tip => `<li>${tip}</li>`).join('')}
                </ul>
              </div>
            </div>
          `;
          card.addEventListener('click', () => {
            card.classList.toggle('expanded');
          });
          cards.appendChild(card);
        });

        section.appendChild(cards);
        browse.appendChild(section);
      });
    }

    // 診断開始
    function startQuiz() {
      quizStarted = true;
      currentQ = 0;
      answers = {};
      document.querySelector('.quiz-intro').style.display = 'none';
      document.querySelector('.quiz-container').classList.add('active');
      displayQuestion();
    }

    // 質問表示
    function displayQuestion() {
      if (currentQ >= Q.length) return;

      const q = Q[currentQ];
      const left = S.find(s => s.id === q.l);
      const right = S.find(s => s.id === q.r);

      document.getElementById('text-a').textContent = q.a;
      document.getElementById('text-b').textContent = q.b;
      document.getElementById('progress-num').textContent = Object.keys(answers).length;

      const progressPercent = (Object.keys(answers).length / Q.length) * 100;
      document.querySelector('.progress-fill').style.width = progressPercent + '%';

      const buttons = document.getElementById('scale-buttons');
      buttons.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.className = 'scale-btn';
        btn.textContent = i;
        if (answers[currentQ] === i) btn.classList.add('selected');
        btn.addEventListener('click', () => answer(i));
        buttons.appendChild(btn);
      }

      document.getElementById('prev-btn').disabled = currentQ === 0;
      document.getElementById('next-btn').disabled = false;

      if (Object.keys(answers).length === Q.length) {
        document.getElementById('completion-panel').classList.add('show');
      } else {
        document.getElementById('completion-panel').classList.remove('show');
      }
    }

    // 回答記録
    function answer(val) {
      answers[currentQ] = val;
      displayQuestion();

      if (Object.keys(answers).length < Q.length) {
        setTimeout(nextQ, 350);
      }
    }

    // 前の質問
    function prevQ() {
      if (currentQ > 0) {
        currentQ--;
        displayQuestion();
      }
    }

    // 次の質問
    function nextQ() {
      if (currentQ < Q.length - 1) {
        currentQ++;
        displayQuestion();
      }
    }

    // スコア計算
    function calcScores() {
      scores = {};
      S.forEach(s => {
        scores[s.id] = { raw: 0, count: 0, name: s.name, cat: s.cat };
      });

      Q.forEach((q, idx) => {
        const val = answers[idx];
        if (val === undefined) return;

        const aScore = 6 - val;
        const bScore = val;

        scores[q.l].raw += aScore;
        scores[q.l].count++;
        scores[q.r].raw += bScore;
        scores[q.r].count++;
      });

      Object.keys(scores).forEach(id => {
        const final = (scores[id].raw / (scores[id].count * 5)) * 100;
        scores[id].final = Math.round(final);
      });

      return scores;
    }

    // 結果表示
    function showResults() {
      if (Object.keys(answers).length < Q.length) return;

      calcScores();

      const results = document.getElementById('results');
      const resultsContainer = document.querySelector('.results-container');
      resultsContainer.classList.add('active');

      const sorted = Object.keys(scores)
        .map(id => ({ id, ...scores[id] }))
        .sort((a, b) => b.final - a.final);

      const domainScores = {};
      ['exe', 'inf', 'rel', 'str'].forEach(cat => {
        const catScores = sorted.filter(s => s.cat === cat).map(s => s.final);
        domainScores[cat] = Math.round(catScores.reduce((a, b) => a + b, 0) / catScores.length);
      });

      const dominant = Object.keys(domainScores).sort((a, b) => domainScores[b] - domainScores[a])[0];

      let html = `
        <div class="results-header">
          <div class="dominant-domain">🎯 あなたの支配的ドメイン: <strong>${CATS[dominant].name}</strong></div>
          <div style="margin-top: 20px;">
      `;

      Object.keys(domainScores).forEach(cat => {
        const score = domainScores[cat];
        html += `
          <div class="domain-score-bar">
            <div class="domain-score-bar-label">${CATS[cat].name}</div>
            <div class="domain-score-bar-fill" style="width: ${score}%; background-color: ${CATS[cat].color};">
              ${score}/100
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </div>

        <div class="top5-section">
          <div class="section-title">🌟 上位5資質</div>
          <div class="top5-cards">
      `;

      sorted.slice(0, 5).forEach((s, idx) => {
        html += `
          <div class="result-card" style="border-left-color: ${CATS[s.cat].color}">
            <div class="result-card-rank">#${idx + 1}</div>
            <div class="result-card-name">${s.name}</div>
            <div class="result-card-score">${s.final}</div>
            <div class="result-card-desc">${S.find(x => x.id === s.id).desc}</div>
          </div>
        `;
      });

      html += `
          </div>
        </div>

        <div class="top5-section">
          <div class="section-title">📊 全34資質ランキング</div>
          <div class="ranking-table">
            <table>
              <thead>
                <tr>
                  <th class="ranking-rank">順位</th>
                  <th class="ranking-name">資質</th>
                  <th class="ranking-score">スコア</th>
                </tr>
              </thead>
              <tbody>
      `;

      sorted.forEach((s, idx) => {
        html += `
          <tr>
            <td class="ranking-rank">#${idx + 1}</td>
            <td class="ranking-name" style="color: ${CATS[s.cat].color}; font-weight: bold;">${s.name}</td>
            <td class="ranking-score">${s.final}/100</td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
          <button class="retry-btn" onclick="resetQuiz()">もう一度診断する</button>
        </div>
      `;

      results.innerHTML = html;

      setTimeout(() => {
        document.querySelectorAll('.domain-score-bar-fill').forEach(el => {
          const width = el.style.width;
          el.style.width = '0';
          setTimeout(() => {
            el.style.transition = 'width 1.2s ease';
            el.style.width = width;
          }, 100);
        });
      }, 100);

      document.querySelectorAll('.tab-btn')[2].click();
    }

    // リセット
    function resetQuiz() {
      quizStarted = false;
      currentQ = 0;
      answers = {};
      scores = {};
      document.querySelector('.quiz-intro').style.display = 'block';
      document.querySelector('.quiz-container').classList.remove('active');
      document.querySelector('.results-container').classList.remove('active');
      document.getElementById('completion-panel').classList.remove('show');
      document.querySelectorAll('.tab-btn')[1].click();
    }

    // 初期化
    buildBrowse();
  </script>
